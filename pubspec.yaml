name: zcw_mobile
description: ZimCrimeWatch — Public Crime Awareness Mobile App for Zimbabwe

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # Interactive map — renders OpenStreetMap tiles with crime pin markers
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # State management — CrimeProvider extends ChangeNotifier
  provider: ^6.1.2

  # HTTP client — calls to ZCW-BACKEND Django REST API
  http: ^1.2.1

  # UI / fonts
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1

  # Date formatting for filter chips and detail sheet
  intl: ^0.19.0

  # Fetches device GPS coordinates with permission handling
  geolocator: ^12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
